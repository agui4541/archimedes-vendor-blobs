name: Validate vendor metadata
on:
  push:
  pull_request:
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check scripts
        run: python -m py_compile tools/extract_blobs.py tools/setup_makefiles.py
      - name: Generate makefiles
        run: ./scripts/setup-makefiles.sh
      - name: Reject sensitive paths
        run: '! grep -Eiq "(^|/)(nvram|nvdata|protect|persist|userdata|metadata)(/|$)" proprietary-files.txt'
